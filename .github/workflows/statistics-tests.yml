name: Statistics tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  statistics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run statistical regression tests
        run: node --test tests/*.test.cjs
